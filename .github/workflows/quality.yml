name: Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Install and verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bcm-soft

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: bcm-soft/.node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test application units
        run: |
          pnpm --filter @bcm-soft/api test:unit
          pnpm --filter @bcm-soft/web test

      - name: Verify PostgreSQL migrations, roles, and RLS
        run: pnpm --filter @bcm-soft/api test:db

      - name: Build
        run: pnpm build
